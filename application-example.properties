# Example configuration template for Gruhalakshmi PDF Generator with Razorpay Payment
# Rename this file to application-prod.properties or set environment variables

spring.application.name=pdf-generator-app
server.port=8080

# Database Configuration (H2 in-memory or PostgreSQL/MySQL for production)
spring.datasource.url=jdbc:h2:mem:pdfgendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Razorpay Configuration (Get these from your Razorpay Dashboard: https://dashboard.razorpay.com/app/keys)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:YOUR_WEBHOOK_SECRET}

# Fixed Payment Configuration (Amount in INR)
payment.amount=100
payment.currency=INR
