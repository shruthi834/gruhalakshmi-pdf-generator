spring.application.name=pdf-generator-app
server.port=${PORT:8080}


# Database Configuration (H2 In-Memory Database for fast, zero-config persistence)
spring.datasource.url=jdbc:h2:mem:pdfgendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Razorpay Test Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TUqWIXerwKdPBP}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:LGE5gI7Po504lYPqqe89n5Ss}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_default}

# Fixed Payment Configuration (Amount in Indian Rupees)
payment.amount=20
payment.currency=INR
